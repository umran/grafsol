[project]
name = "grafsol-inference"
version = "0.1.0"
description = "grafsol's own model services: text embeddings and document summaries from open models that run on your own machine, served with BentoML."
requires-python = ">=3.12,<3.14"
dependencies = [
    "bentoml>=1.4.40,<1.5",
    "huggingface-hub>=2.4,<3",
    "numpy>=2.5,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sentence-transformers>=6.3,<7",
    "torch>=2.15,<3",
    "transformers>=5.22,<6",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafsol_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: loads the real models, which takes minutes and gigabytes; runs only when GRAFSOL_TEST_MODELS=1",
]
filterwarnings = [
    # Raised inside BentoML and a library it uses, about their own code.
    "ignore::DeprecationWarning:pathspec.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, modern syntax, simplifications.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["grafsol_inference", "tests"]
strict = true

[[tool.mypy.overrides]]
# BentoML's decorators are not typed, so mypy cannot see through them.
module = "grafsol_inference.services"
disallow_untyped_decorators = false
