# Postgres with the pgvector extension, for the integration tests in
# storage/postgres. The credentials below are throwaway values for this local
# test database only.
#
#   docker compose up -d --wait
#   GRAFSOL_TEST_POSTGRES_URL=postgres://grafsol:grafsol@localhost:54329/grafsol go test ./...
#   docker compose down -v
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: grafsol
      POSTGRES_PASSWORD: grafsol
      POSTGRES_DB: grafsol
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafsol -d grafsol"]
      interval: 1s
      timeout: 3s
      retries: 30
